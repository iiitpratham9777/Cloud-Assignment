# Single-node SeaweedFS (master + volume + filer + S3 gateway in one Pod), namespace `data`.
# The S3 identity file comes from Secret `seaweedfs-s3-config` (created by scripts/make_secrets.sh).
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: seaweedfs, namespace: data}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.68
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333",
                 "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=20", "-master.volumeSizeLimitMB=512"]
          ports:
            - {containerPort: 8333, name: s3}
            - {containerPort: 9333, name: master}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
