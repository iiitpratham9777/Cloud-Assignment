apiVersion: apps/v1
kind: Deployment
metadata: {name: command-parser, namespace: app}
spec:
  replicas: 2
  selector: {matchLabels: {app: command-parser}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # never remove a ready Pod before a new one is ready
  template:
    metadata: {labels: {app: command-parser}}
    spec:
      containers:
        - name: parser
          image: command-parser:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_VERSION, value: "v1"}
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 3
