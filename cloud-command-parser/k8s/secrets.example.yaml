# EXAMPLE ONLY - real values are generated at deploy time by scripts/make_secrets.sh into
# .secrets/s3.env (git-ignored) and applied with `kubectl create secret`. Never commit real keys.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: app            # also created in namespaces: data (s3-config) and pipeline
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<generated>"
  AWS_SECRET_ACCESS_KEY: "<generated>"
